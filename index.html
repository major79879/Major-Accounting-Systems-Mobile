<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<title>ERP Mobile Accounting</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--p:#1a73e8;--p2:#0b57d0;--pc:#d3e3fd;--bg:#f8f9fc;--s:#fff;--s2:#f1f3f8;--tx:#1f1f1f;--mt:#5f6368;--ln:#e3e6ec;--ok:#137333;--okc:#e6f4ea;--bad:#c5221f;--badc:#fce8e6;--wr:#b06000;--wrc:#fef7e0;--r:18px;--sh:0 1px 2px rgba(60,64,67,.3),0 2px 8px rgba(60,64,67,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;overflow:hidden}
body[dir=ltr]{font-family:"Segoe UI",Roboto,Arial,sans-serif}
button{font-family:inherit;border:0;cursor:pointer;font-size:14px}
input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:12px 14px;border:1px solid #c4c7c5;border-radius:12px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pc);border-color:var(--p)}
textarea{min-height:64px;resize:vertical}
label.l{display:block;font-size:12px;color:var(--mt);margin:0 4px 5px}
.hidden{display:none!important}
.btn{background:var(--p);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600}
.btn.t{background:transparent;color:var(--p)} .btn.g{background:var(--s2);color:var(--tx)} .btn.d{background:var(--bad)} .btn.ok{background:var(--ok)}
.btn.blk{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:999px;font-size:12px;background:var(--s2);color:var(--tx)}
.chip.ok{background:var(--okc);color:var(--ok)} .chip.bad{background:var(--badc);color:var(--bad)} .chip.wr{background:var(--wrc);color:var(--wr)} .chip.p{background:var(--pc);color:var(--p2)}
/* login */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#0b57d0,#1a73e8 50%,#8ab4f8);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.lcard{background:#fff;border-radius:28px;padding:30px 24px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.logo{width:64px;height:64px;border-radius:20px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 12px}
/* shell */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{background:var(--s);padding:12px 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ln);box-shadow:0 1px 3px rgba(0,0,0,.05);z-index:5}
.bar h1{margin:0;font-size:19px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:40px;height:40px;border-radius:50%;background:transparent;display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:var(--tx);position:relative}
.ico:active{background:var(--s2)}
.dot{position:absolute;top:4px;inset-inline-end:4px;background:var(--bad);color:#fff;border-radius:10px;font-size:10px;min-width:16px;padding:0 4px;line-height:16px}
#content{flex:1;overflow:auto;padding:14px 14px 110px;-webkit-overflow-scrolling:touch}
nav.tabs{position:fixed;bottom:0;inset-inline:0;background:var(--s);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--ln);z-index:10}
nav.tabs button{background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mt);font-size:11px;padding:6px 8px;border-radius:14px;min-width:64px}
nav.tabs button .ti{font-size:20px;width:48px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center}
nav.tabs button.on{color:var(--tx);font-weight:600} nav.tabs button.on .ti{background:var(--pc)}
.fab{position:fixed;bottom:88px;inset-inline-end:18px;width:58px;height:58px;border-radius:18px;background:var(--pc);color:#041e49;font-size:28px;box-shadow:var(--sh);z-index:9;display:flex;align-items:center;justify-content:center}
/* cards & lists */
.card{background:var(--s);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:600}
.hero{background:linear-gradient(135deg,#1a73e8,#4285f4 60%,#8ab4f8);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
.hero .s{font-size:12px;opacity:.9} .hero .b{font-size:28px;font-weight:700;margin-top:4px}
.kpis{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin:0 -14px 12px;padding-inline:14px;scrollbar-width:none}
.kpi{min-width:150px;background:var(--s);border-radius:18px;padding:14px;box-shadow:var(--sh);flex-shrink:0}
.kpi .l{font-size:12px;color:var(--mt)} .kpi .v{font-size:20px;font-weight:700;margin-top:4px}
.kpi .bar{height:4px;border-radius:4px;margin-top:10px;background:var(--s2);overflow:hidden;box-shadow:none;padding:0;border:0;display:block}
.kpi .bar i{display:block;height:100%;background:var(--p)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.qa button{background:var(--s);border-radius:18px;padding:12px 4px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--tx)}
.qa button span.e{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px}
.li{background:var(--s);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);display:flex;align-items:center;gap:12px;cursor:pointer}
.li:active{background:#f5f7fb}
.av{width:42px;height:42px;border-radius:50%;background:var(--pc);color:var(--p2);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.li .m{flex:1;min-width:0} .li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .li .sub{font-size:12px;color:var(--mt);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{text-align:end;font-weight:600;white-space:nowrap}
.search{position:relative;margin-bottom:12px}
.search input{padding-inline-start:44px;border-radius:999px;background:var(--s2);border:0}
.search:before{content:"🔍";position:absolute;inset-inline-start:14px;top:11px;opacity:.6}
.seg{display:flex;background:var(--s2);border-radius:999px;padding:4px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;background:transparent;padding:8px 12px;border-radius:999px;color:var(--mt);white-space:nowrap;font-size:13px}
.seg button.on{background:var(--s);color:var(--tx);font-weight:600;box-shadow:var(--sh)}
.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:start;color:var(--mt);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--ln);white-space:nowrap}
table.t td{padding:9px 6px;border-bottom:1px solid #f0f2f5}
.scrollx{overflow-x:auto}
.empty{text-align:center;color:var(--mt);padding:30px 10px}
.empty .e{font-size:44px;margin-bottom:6px}
/* sheets (modal) */
.sheet-bg{position:fixed;inset:0;background:rgba(32,33,36,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@media(min-width:760px){.sheet-bg{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:up .25s;overflow:hidden}
@media(min-width:760px){.sheet{border-radius:28px;max-height:90vh}}
.sheet .sb{background:var(--s);padding:14px 14px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ln)}
.sheet .sb h2{margin:0;font-size:17px;flex:1;font-weight:600}
.sheet .sc{padding:14px;overflow:auto;flex:1}
.sheet .sf{background:var(--s);padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--ln);display:flex;gap:10px}
.sheet .sf .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
@media(max-width:480px){.fg{grid-template-columns:1fr}}
.fld{position:relative}
.fld .n{position:absolute;top:-8px;inset-inline-start:-6px;background:#e8710a;color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;display:none;align-items:center;justify-content:center;z-index:2;font-weight:700}
.fld.hl input,.fld.hl select,.fld.hl textarea{border-color:#e8710a;box-shadow:0 0 0 3px #fde7d2}
.fld.hl .n{display:flex}
.fld .hx{font-size:12px;color:#174ea6;background:#e8f0fe;border-radius:12px;padding:8px 10px;margin-top:6px}
.help-btn{position:absolute;top:-6px;inset-inline-end:-4px;background:#fff;border:1px solid var(--ln);border-radius:50%;width:24px;height:24px;font-size:12px;color:var(--p);z-index:2}
.lines{border:1px solid var(--ln);border-radius:16px;background:var(--s);overflow:hidden}
.lrow{padding:10px;border-bottom:1px solid var(--ln);display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;align-items:end}
.lrow .sn{grid-column:1/-1}
.lrow .rm{grid-column:1/-1;text-align:end}
.lrow .sub{font-size:12px;color:var(--mt);grid-column:1/-1}
.lrow select,.lrow input{padding:9px 10px;font-size:14px;border-radius:10px}
.tot{padding:12px 14px;background:var(--s2);display:flex;justify-content:space-between;font-weight:600}
.preview{background:var(--s);border-radius:16px;padding:12px;margin-top:12px;box-shadow:var(--sh);font-size:13px}
.preview .r{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--ln)}
.err{color:var(--bad);font-size:13px;margin-top:8px}
/* rating (play-store like) */
.rate-top{display:flex;gap:18px;align-items:center}
.rate-big{text-align:center;min-width:110px}
.rate-big .n{font-size:52px;font-weight:700;line-height:1}
.stars{color:#f9ab00;letter-spacing:2px;font-size:18px}
.dist div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mt);margin:3px 0}
.dist .b{flex:1;height:8px;background:var(--s2);border-radius:6px;overflow:hidden}
.dist .b i{display:block;height:100%;background:#1a73e8;border-radius:6px}
.review{border-top:1px solid var(--ln);padding:12px 0}
.review .who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.review .txt{font-size:14px;margin-top:6px;color:#3c4043}
/* toasts */
#toasts{position:fixed;top:14px;inset-inline:14px;display:flex;flex-direction:column;gap:8px;z-index:300;align-items:center}
.toast{background:#323232;color:#fff;padding:12px 18px;border-radius:14px;box-shadow:var(--sh);animation:up .25s;max-width:520px;font-size:14px}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)} .toast.wr{background:var(--wr)}
/* chat */
#chat{position:fixed;inset:0;background:var(--bg);z-index:120;display:flex;flex-direction:column}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.6;white-space:pre-wrap;box-shadow:var(--sh)}
.msg.bot{background:var(--s);align-self:flex-start;border-bottom-right-radius:6px}
.msg.me{background:var(--p);color:#fff;align-self:flex-end;border-bottom-left-radius:6px}
#chatin{display:flex;gap:8px;padding:10px;background:var(--s);border-top:1px solid var(--ln)}
#chatin input{border-radius:999px}
.sug{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.sug button{white-space:nowrap;background:var(--pc);color:#041e49;border-radius:999px;padding:7px 12px;font-size:12px}
/* print */
@media print{
 body{background:#fff;overflow:visible} #app{position:static}
 .bar,nav.tabs,.fab,#toasts,#chat,.no-print,.sheet-bg{display:none!important}
 #content{overflow:visible;padding:0} .card,.li{box-shadow:none;border:1px solid #ccc}
 .print-title{display:block!important}
}
.print-title{display:none;font-size:20px;font-weight:700;margin-bottom:10px}
</style>
</head>

 </div>

const itemById=id=>S.items.find(i=>i.id===id);

const bankById=id=>S.banks.find(b=>b.id===id);
const accByCode=c=>S.accounts.find(a=>a.code===+c);
const accName=c=>{const a=accByCode(c);return a?nm({ar:a.ar,en:a.en}):c;};
const rateOf=o=>o.fx||1;
const linkedOf=o=>o.ref?S.ops.find(x=>x.doc===o.ref):null;
const effParty=o=>o.party||(linkedOf(o)&&linkedOf(o).party)||"";
const isLines=o=>Array.isArray(o.lines)&&o.lines.length>0;
function lineNet(o){ if(!isLines(o)) return 0; return o.lines.reduce((a,l)=>a+(+l.qty||0)*(+l.price||0),0)*rateOf(o); }
function chqAmount(chq){ const c=S.ops.find(o=>o.chq===chq&&(o.type==="CHQ_REC"||o.type==="CHQ_ISS")); return c?(+c.amount||0)*rateOf(c):0; }
function netOf(o){
 if(isLines(o)) return lineNet(o);
 if(["CHQ_DEP","CHQ_COL","CHQ_RET","CHQ_PAID"].includes(o.type)&&!o.amount) return chqAmount(o.chq);
 if(!o.amount&&linkedOf(o)&&["INV","SRET","PINV","PRET"].includes(o.type)) return netOf(linkedOf(o));
 return (+o.amount||0)*rateOf(o);
}

function stockState(){
 const st={}; S.items.forEach(i=>st[i.id]={oq:+i.oq||0,ov:+i.ov||0,pq:0,pv:0,sq:0,avg:0,onhand:0,value:0});
 S.ops.forEach(o=>{ if(!isLines(o)) return; o.lines.forEach(l=>{ const s=st[l.item]; if(!s) return; const q=+l.qty||0;
   const v=q*(+l.price||0)*rateOf(o);
   if(o.type==="PINV"){ s.pq+=q; s.pv+=v; }
   if(o.type==="PRET"){ s.pq-=q; s.pv-=v; }
   if(o.type==="INV") s.sq+=q; if(o.type==="SRET") s.sq-=q; }); });
 S.items.forEach(i=>{ const s=st[i.id]; s.avg=(s.oq+s.pq)>0?(s.ov+s.pv)/(s.oq+s.pq):0;
   if(+i.serial){ const ins=S.serials.filter(x=>x.item===i.id&&x.status==="in"); s.onhand=ins.length; s.value=ins.reduce((a,x)=>a+(+x.cost||0),0); s.avg=s.onhand?s.value/s.onhand:0; }
   else { s.onhand=s.oq+s.pq-s.sq; s.value=r2(s.onhand*s.avg); } });
 return st;
}
const onhand=id=>{const s=stockState()[id];return s?s.onhand:0;};
function postingOf(o,st){
 const r=RULE[o.type]; if(!r||r.memo) return {lines:[],net:0,tax:0,gross:0,cost:0};
 st=st||stockState(); const net=r2(netOf(o)); const tax=(r.tax&&o.taxq)?r2(net*S.settings.taxRate):0; const gross=r2(net+tax);
 const bank=o.bank?bankById(o.bank):null; const bankGL=bank?String(bank.gl):"";
 const code=k=>k==="CB"?bankGL:k==="ACC"?String(o.account||""):CONTROL[k];
 const party=effParty(o);
 const dA=r.ctrlDr?gross:net, cA=r.ctrlCr?gross:net;
 const dC=code(r.dr), cC=code(r.cr);
 const L=[{code:dC,dr:dA,cr:0,party:(dC===CONTROL.AR||dC===CONTROL.AP)?party:""},{code:cC,dr:0,cr:cA,party:(cC===CONTROL.AR||cC===CONTROL.AP)?party:""}];
 if(tax>0&&r.tax){ const tc=CONTROL[r.tax]; L.push(r.taxSide==="DR"?{code:tc,dr:tax,cr:0,party:""}:{code:tc,dr:0,cr:tax,party:""}); }
 let cost=0;
 if(r.item&&isLines(o)&&(o.type==="INV"||o.type==="SRET")){
   o.lines.forEach(l=>{ const it=itemById(l.item); if(!it) return; const q=+l.qty||0;
     if(+it.serial) cost+=(l.sn||[]).reduce((a,sn)=>{const x=S.serials.find(s=>s.sn===sn);return a+(x?+x.cost||0:0);},0);
     else cost+=q*(st[l.item]?st[l.item].avg:0); });
   cost=r2(cost);
   if(cost>0){ if(o.type==="INV"){ L.push({code:CONTROL.COGS,dr:cost,cr:0,party:""}); L.push({code:CONTROL.INV,dr:0,cr:cost,party:""}); }
     else { L.push({code:CONTROL.INV,dr:cost,cr:0,party:""}); L.push({code:CONTROL.COGS,dr:0,cr:cost,party:""}); } }
 }
 return {lines:L.filter(x=>x.code),net,tax,gross,cost};
}
function allLines(){ const st=stockState(); const out=[]; S.ops.forEach(o=>postingOf(o,st).lines.forEach(l=>out.push(Object.assign({date:o.date,doc:o.doc||"",type:o.type,opId:o.id},l)))); return out; }
function cheques(){
 return S.ops.filter(o=>o.type==="CHQ_REC"||o.type==="CHQ_ISS").map(o=>{ const same=S.ops.filter(x=>x.chq===o.chq); let st;
   if(o.type==="CHQ_REC") st=same.some(x=>x.type==="CHQ_COL")?"st_col":same.some(x=>x.type==="CHQ_RET")?"st_ret":same.some(x=>x.type==="CHQ_DEP")?"st_dep":"st_port";
   else st=same.some(x=>x.type==="CHQ_PAID")?"st_paid":"st_iss";
   return Object.assign({},o,{status:st,amt:netOf(o)}); });
}
function openAmount(inv){ const st=stockState(); const g=postingOf(inv,st).gross; let paid=0,ret=0;
 S.ops.filter(o=>o.ref===inv.doc).forEach(o=>{ if(o.type==="CASH_REC"||o.type==="CHQ_REC") paid+=postingOf(o,st).net; if(o.type==="CHQ_RET") paid-=postingOf(o,st).net; if(o.type==="SRET") ret+=postingOf(o,st).gross; });
 return r2(g-paid-ret); }
const dueOf=o=>o.type==="INV"?(o.due||addDays(o.date,+o.term||0)):(o.due||"");
function partyBalance(id){ const p=partyById(id); if(!p) return 0; const ls=allLines().filter(l=>l.party===id);
 if(p.type==="C") return r2(ls.filter(l=>+l.code===+CONTROL.AR).reduce((a,l)=>a+l.dr-l.cr,0));
 return r2(-ls.filter(l=>+l.code===+CONTROL.AP).reduce((a,l)=>a+l.dr-l.cr,0)); }
// rating: each on-time/early/late receipt is a "review" scored 5..1 by delay
function starsFor(d){ return d<=0?5:d<=7?4:d<=15?3:d<=30?2:1; }
function ratingOf(id){
 const rv=S.ops.filter(o=>(o.type==="CASH_REC"||o.type==="CHQ_REC")&&o.ref&&effParty(o)===id).map(o=>{ const inv=linkedOf(o); const d=inv?dayDiff(o.date,dueOf(inv)):null;
   return {date:o.date,doc:o.doc,delay:d,stars:d===null?null:starsFor(d)}; }).filter(x=>x.stars!==null);
 const n=rv.length; const avg=n?rv.reduce((a,x)=>a+x.stars,0)/n:0;
 const dist=[5,4,3,2,1].map(s=>rv.filter(x=>x.stars===s).length);
 const ontime=n?rv.filter(x=>x.delay<=0).length/n:0;
 return {n,avg:r2(avg),dist,ontime,reviews:rv.sort((a,b)=>b.date.localeCompare(a.date))};
}
function alerts(){
 const out=[]; const td=today();
 cheques().filter(c=>c.status==="st_port"||c.status==="st_iss").forEach(c=>{ if(!c.due) return; const d=dayDiff(c.due,td);
   if(d<0) out.push({k:"c"+c.id,lvl:"bad",ic:"⏰",txt:t("over_chq")+" · "+c.chq+" · "+fmt(c.amt),go:["ops",c.id]});
   else if(d<=S.settings.alertDays) out.push({k:"s"+c.id,lvl:"wr",ic:"⏰",txt:t("soon_chq")+" · "+c.chq+" · "+c.due,go:["ops",c.id]}); });
 S.ops.filter(o=>o.type==="INV").forEach(inv=>{ const oa=openAmount(inv); const d=dueOf(inv); if(oa>0&&d&&dayDiff(td,d)>0) out.push({k:"i"+inv.id,lvl:"bad",ic:"🧾",txt:t("over_inv")+" · "+inv.doc+" · "+fmt(oa),go:["ops",inv.id]}); });
 const st=stockState(); S.items.forEach(i=>{ const s=st[i.id]; if(s&&s.onhand<=(+i.reorder||0)) out.push({k:"l"+i.id,lvl:"wr",ic:"📦",txt:t("low")+" · "+nm(i)+" ("+fmt(s.onhand)+")",go:["item",i.id]}); });
 return out;
}
// ---------- serial register ----------
function serialsApply(o,dir){ // dir=+1 apply, -1 revert
 const doc=o.doc; if(!isLines(o)) return;
 if(o.type==="PINV"){ if(dir>0) o.lines.forEach(l=>{ const it=itemById(l.item); if(it&&+it.serial) (l.sn||[]).forEach(sn=>S.serials.push({sn,item:l.item,cost:r2((+l.price||0)*rateOf(o)),status:"in",doc,date:o.date,party:o.party})); });
   else S.serials=S.serials.filter(x=>x.doc!==doc); }
 if(o.type==="INV"){ o.lines.forEach(l=>(l.sn||[]).forEach(sn=>{ const x=S.serials.find(s=>s.sn===sn); if(!x) return; if(dir>0){ x.status="sold"; x.doc=doc; x.saleParty=effParty(o); } else { x.status="in"; x.doc=""; } })); }
 if(o.type==="SRET"){ o.lines.forEach(l=>(l.sn||[]).forEach(sn=>{ const x=S.serials.find(s=>s.sn===sn); if(!x) return; if(dir>0){ x.status="in"; x.doc="RET:"+doc; } else { x.status="sold"; x.doc=o.ref||""; } })); }
 if(o.type==="PRET"){ o.lines.forEach(l=>(l.sn||[]).forEach(sn=>{ const x=S.serials.find(s=>s.sn===sn); if(!x) return; if(dir>0){ x.status="ret"; x.doc=doc; } else { x.status="in"; x.doc=o.ref||""; } })); }
}
// ---------- validation ----------
function fieldErrors(o,editId){
 const e=[]; const R=OPS[o.type]; if(!R) return ["e_op"];
 if(!o.date) e.push("e_date");
 if(R.party){ const p=partyById(o.party); if(!p||p.type!==R.party) e.push("e_party"); }
 if(["CHQ_REC","CHQ_ISS","CHQ_DEP","CHQ_COL","CHQ_RET","CHQ_PAID"].includes(o.type)){
   if(!o.chq) e.push("e_chq");
   if((o.type==="CHQ_REC"||o.type==="CHQ_ISS")&&S.ops.some(x=>x.id!==editId&&x.chq===o.chq&&x.type===o.type)) e.push("e_dup");
   if(!["CHQ_REC","CHQ_ISS"].includes(o.type)&&!S.ops.some(x=>x.chq===o.chq&&(x.type==="CHQ_REC"||x.type==="CHQ_ISS"))) e.push("e_nochq");
 }
 if(["CHQ_REC","CHQ_ISS"].includes(o.type)&&!o.due) e.push("e_due");
 if(["CASH_REC","CHQ_DEP","CHQ_RET","CASH_PAY","CHQ_ISS","CHQ_PAID"].includes(o.type)&&!o.bank) e.push("e_bank");
 if(o.type==="EXP"&&!o.account) e.push("e_acc");
 if(o.ref&&!S.ops.some(x=>x.doc===o.ref)) e.push("e_ref");
 if(R.lines){
   if(!isLines(o)) { e.push("e_lines"); }
   else {
     const st=stockState();
     if(o.lines.some(l=>!l.item||!(+l.qty>0)||!(+l.price>=0))) e.push("e_line");
     o.lines.forEach(l=>{
       const it=itemById(l.item); if(!it) return; const q=+l.qty||0;
       if(+it.serial){
         const sn=l.sn||[];
         if(sn.length!==q) e.push("e_sn");
         sn.forEach(x0=>{ const x=S.serials.find(z=>z.sn===x0);
           if(o.type==="PINV"&&x) e.push("e_sn_dup");
           if(o.type==="INV"&&(!x||x.status!=="in")) e.push("e_sn_na");
           if(o.type==="PRET"&&(!x||x.status!=="in")) e.push("e_sn_na");
           if(o.type==="SRET"&&(!x||x.status!=="sold")) e.push("e_sn_ret"); });
       } else if(o.type==="INV"&&q>(st[l.item]?st[l.item].onhand:0)) e.push("e_stock");
     });
   }
 } else {
   if(!o.doc&&!["CHQ_DEP","CHQ_COL","CHQ_PAID"].includes(o.type)) e.push("e_doc");
   if(!RULE[o.type]||!RULE[o.type].memo){ if(!["CHQ_DEP","CHQ_COL","CHQ_PAID"].includes(o.type)&&!(netOf(o)>0)) e.push("e_amt"); }
 }
 return [...new Set(e)];
}
function lineQtyBefore(id,item){ const old=S.ops.find(x=>x.id===id); if(!old||!isLines(old)) return 0; return old.lines.filter(l=>l.item===item).reduce((a,l)=>a+(+l.qty||0),0); }
// ---------- commit / delete ----------
function saveOpObj(o){
 const old=o.id?S.ops.find(x=>x.id===o.id):null; let idx=-1;
 if(old){ serialsApply(old,-1); idx=S.ops.indexOf(old); S.ops.splice(idx,1); }
 const errs=fieldErrors(o,o.id||null);
 if(errs.length){ if(old){ S.ops.splice(idx,0,old); serialsApply(old,+1); } return errs; }
 if(old){ S.ops.splice(idx,0,o); } else { o.id=S.nextId++; S.ops.push(o); }
 serialsApply(o,+1); persist(); return [];
}
function deleteOp(id){ const o=S.ops.find(x=>x.id===id); if(!o) return; serialsApply(o,-1); S.ops=S.ops.filter(x=>x.id!==id); persist(); }
function convertTo(o,type){ // SO->INV, PO->PINV
 const n={id:0,date:today(),doc:(type==="INV"?"INV-":"PINV-")+String(S.nextId).padStart(3,"0"),type,party:o.party,rep:o.rep,ref:o.doc,lines:JSON.parse(JSON.stringify(o.lines||[])),taxq:o.taxq,pm:o.pm,term:o.term,cur:o.cur,fx:o.fx,notes:"from "+o.doc};
 return n;
}

// ================= P&L and reports =================
function plStats(){
 const bal={}; S.accounts.forEach(a=>bal[a.code]=0);
 const acc={}; S.accounts.forEach(a=>acc[a.code]=a);
 const L=allLines(); const dsum={};
 L.forEach(l=>{ dsum[+l.code]=(dsum[+l.code]||0)+(l.dr-l.cr); });
 S.accounts.forEach(a=>{ const v=(a.open||0)+(dsum[a.code]||0); bal[a.code]=a.side==="D"?v:-v; });
 const sub=s=>S.accounts.filter(a=>a.sub===s).reduce((x,a)=>x+bal[a.code],0);
 const cat=c=>S.accounts.filter(a=>a.cat===c).reduce((x,a)=>x+bal[a.code],0);
 const rev=-sub("OPREV")-sub("OTHREV"), cogs=sub("COS"), opex=sub("OPEX");
 const tot={dr:L.reduce((a,l)=>a+l.dr,0),cr:L.reduce((a,l)=>a+l.cr,0)};
 return {bal,acc,revenue:rev,cogs,opex,gp:rev-cogs,np:rev-cogs-opex,assets:cat("A"),liab:-cat("L"),eq:-cat("E"),tot};
}

   return {title:t("tb"),heads:[t("code"),t("nm"),t("debit"),t("credit")],rows}; }
 if(key==="is") return {title:t("is"),heads:[t("item"),t("amount")],rows:[[t("rev_t")||"Revenue",r2(pl.revenue)],["COGS",r2(pl.cogs)],[t("gp_t")||"Gross profit",r2(pl.gp)],[t("opex_t")||"Operating expenses",r2(pl.opex)],[t("np_t")||"Net profit",r2(pl.np)]]};

 if(key==="aging"){ const b=[0,0,0,0,0]; const rows=[]; S.ops.filter(o=>o.type==="INV").forEach(o=>{ const oa=openAmount(o); if(oa<=0) return; const d=Math.max(0,dayDiff(td,dueOf(o))); const i=d<=0?0:d<=30?1:d<=60?2:d<=90?3:4; b[i]+=oa; rows.push([dueOf(o),o.doc,nm(partyById(effParty(o))),oa,d]); });

 if(key==="due"){ const rows=[]; cheques().filter(c=>(c.status==="st_port"||c.status==="st_iss")&&c.due).forEach(c=>rows.push([c.due,"cheque "+c.chq,nm(partyById(effParty(c))),c.amt,c.status==="st_iss"?t("st_iss"):t("st_port")]));

   rows.sort((a,b)=>String(a[0]).localeCompare(String(b[0]))); return {title:t("due_cal"),heads:[t("date"),t("doc"),t("party"),t("amount"),t("status")],rows}; }
 if(key==="rep_sales"){ const m={}; S.ops.filter(o=>o.type==="INV"||o.type==="SRET").forEach(o=>{ const k=o.rep||"—"; m[k]=(m[k]||0)+(o.type==="INV"?1:-1)*postingOf(o,st).net; });
   return {title:t("rep_sales_rep"),heads:[t("rep"),t("net")],rows:Object.entries(m).map(([k,v])=>[k,r2(v)])}; }
 if(key==="rep_items"){ const m={}; S.ops.filter(o=>o.type==="INV"||o.type==="SRET").forEach(o=>(o.lines||[]).forEach(l=>{ const s=(o.type==="INV"?1:-1); m[l.item]=m[l.item]||{q:0,v:0}; m[l.item].q+=s*(+l.qty||0); m[l.item].v+=s*(+l.qty||0)*(+l.price||0)*rateOf(o); }));
   return {title:t("rep_items"),heads:[t("item"),t("qty"),t("net")],rows:Object.entries(m).map(([k,v])=>[nm(itemById(k)),r2(v.q),r2(v.v)])}; }
 if(key==="stock_q") return {title:t("rep_stock_q"),heads:[t("code"),t("item"),t("cat_t")||"Category",t("opening"),t("onhand_t")||"On hand"],rows:S.items.map(i=>[i.id,nm(i),i.cat||"",+i.oq||0,st[i.id].onhand])};
 if(key==="stock_v") return {title:t("rep_stock_v"),heads:[t("code"),t("item"),t("qty"),t("price"),t("balance")],rows:S.items.map(i=>[i.id,nm(i),st[i.id].onhand,r2(st[i.id].avg),r2(st[i.id].value)])};
 if(key==="serial") return {title:t("rep_serial"),heads:[t("date"),t("serials"),t("item"),t("status"),t("doc"),t("party"),t("cost")],rows:S.serials.map(x=>[x.date||"",x.sn,nm(itemById(x.item)),t("st_"+(x.status==="in"?"in":x.status==="sold"?"sold":"in")),x.doc||"",nm(partyById(x.party||x.saleParty||""))||"",r2(x.cost)])};
 if(key==="cheques") return {title:t("rep_cheques"),heads:[t("date"),t("chq"),t("party"),t("amount"),t("due"),t("status")],rows:cheques().map(c=>[c.date,c.chq,nm(partyById(effParty(c))),r2(c.amt),c.due||"",t(c.status)])};

 return {title:"?",heads:[],rows:[]};
}

  ${canWrite()?`<div style="margin-top:12px"><label class="l">${t("kind")||"Type"}</label><select id="fk"><option value="taxcard">${LANG==="ar"?"بطاقة ضريبية":"Tax card"}</option><option value="register">${LANG==="ar"?"سجل تجاري":"Commercial register"}</option><option value="contract">${LANG==="ar"?"عقد":"Contract"}</option><option value="other">${LANG==="ar"?"أخرى":"Other"}</option></select><input type="file" id="fi" style="margin-top:8px" onchange="addFile('${p.id}',this.files[0])"><div style="font-size:12px;color:var(--mt);margin-top:6px">${LANG==="ar"?"الحد 700 كيلوبايت لكل ملف":"Max 700 KB per file"}</div></div>`:""}</div>`;
 }
 return head+segs+body+(canWrite()?`<button class="btn g blk" style="margin-top:8px" onclick="openPartyForm('${p.id}')">✎ ${t("edit")}</button>`:"");

function addNote(id){ const p=partyById(id); const tx=$("nn").value.trim(); if(!tx) return; p.notes=p.notes||[]; p.notes.unshift({d:today(),s:+$("ns").value,t:tx}); persist(); render(); }
function addFile(id,f){ if(!f) return; if(f.size>700*1024) return toast(LANG==="ar"?"الملف أكبر من 700 كيلوبايت":"File over 700 KB","bad"); const r=new FileReader(); r.onload=()=>{ const p=partyById(id); p.files=p.files||[]; p.files.push({name:f.name,size:f.size,kind:$("fk").value,data:r.result}); if(!persist()){ p.files.pop(); } render(); toast(t("saved"),"ok"); }; r.readAsDataURL(f); }
function delFile(id,i){ const p=partyById(id); p.files.splice(i,1); persist(); render(); }

// ================= OPERATION FORM =================
let FORM=null; let HLIST=null;
const LINEKINDS=["SO","INV","SRET","PO","PINV","PRET"];
const CANREF={INV:"SO",PINV:"PO",SRET:"INV",PRET:"PINV",CASH_REC:"INV",CHQ_REC:"INV",CASH_PAY:"PINV",PO:null};
function refOptions(type,party){ const want=CANREF[type]; if(!want) return []; return S.ops.filter(o=>o.type===want&&(!party||effParty(o)===party)&&(want!=="SO"||!S.ops.some(x=>x.type==="INV"&&x.ref===o.doc))&&(want!=="PO"||!S.ops.some(x=>x.type==="PINV"&&x.ref===o.doc))); }
function openOp(type,editId,prefill){
 if(!can(type)) return toast(t("denied"),"bad");
 const old=editId?S.ops.find(x=>x.id===+editId):null;
 const base=old?JSON.parse(JSON.stringify(old)):Object.assign({date:today(),cur:S.settings.cur,fx:1,taxq:1,term:0},prefill||{});
 if(!old&&!base.doc&&!["CHQ_DEP","CHQ_COL","CHQ_PAID"].includes(type)) base.doc=(type==="SO"?"SO":type==="INV"?"INV":type==="PO"?"PO":type==="PINV"?"PINV":type==="EXP"?"EXP":type)+"-"+String(S.nextId).padStart(3,"0");
 if(!base.date) base.date=today();
 FORM={type,id:old?old.id:null,d:base,lines:(base.lines||[]).map(l=>({item:l.item,qty:l.qty,price:l.price,sn:(l.sn||[]).join(", ")}))};
 if(LINEKINDS.includes(type)&&!FORM.lines.length) FORM.lines=[{item:"",qty:1,price:"",sn:""}];
 HLIST=null; renderForm();
}
function formFields(){
 const type=FORM.type; const d=FORM.d; const F=OPS[type].f; const out=[];
 const sel=(id,opts,val)=>`<select id="f_${id}" onchange="fset('${id}',this.value)">${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(val)===String(v)?"selected":""}>${l}</option>`).join("")}</select>`;
 const inp=(id,val,type2,ph)=>`<input id="f_${id}" type="${type2||"text"}" ${type2==="number"?'step="any"':""} value="${esc(val??"")}" placeholder="${ph||""}" oninput="fset('${id}',this.value)">`;
 F.forEach(f=>{
  if(f==="lines") return;
  let h="";
  if(f==="date") h=`<label class="l">${t("date")}</label>${inp("date",d.date,"date")}`;
  if(f==="doc") h=`<label class="l">${t("doc")}</label>${inp("doc",d.doc||"","text","INV-001")}`;
  if(f==="party"){ const pty=OPS[type].party; const ps=S.parties.filter(p=>!pty||p.type===pty); h=`<label class="l">${t("party")}</label>${sel("party",[["",LANG==="ar"?"— اختر —":"— select —"]].concat(ps.map(p=>[p.id,nm(p)])),d.party)}`; }
  if(f==="rep") h=`<label class="l">${t("rep")}</label>${sel("rep",[["",LANG==="ar"?"— اختر —":"— select —"]].concat(S.settings.staff.map(s=>[s,s])),d.rep)}`;
  if(f==="ref") h=`<label class="l">${t("ref")}</label>${sel("ref",[["",LANG==="ar"?"بدون ربط":"No link"]].concat(refOptions(type,d.party).map(o=>[o.doc,o.doc+" · "+o.date])),d.ref)}`;
  if(f==="amount") h=`<label class="l">${t("amount")}</label>${inp("amount",d.amount??"","number")}`;
  if(f==="cur") h=`<label class="l">${t("cur")}</label>${sel("cur",["USD","SAR","EGP","EUR","AED"].map(c=>[c,c]),d.cur)}`;
  if(f==="chq") h=`<label class="l">${t("chq")}</label>${inp("chq",d.chq||"","text","CHQ-501")}`;
  if(f==="due") h=`<label class="l">${t("due")}</label>${inp("due",d.due||"","date")}`;
  if(f==="bank") h=`<label class="l">${t("bank")}</label>${sel("bank",[["",LANG==="ar"?"— اختر —":"— select —"]].concat(S.banks.map(b=>[b.id,nm(b)])),d.bank)}`;
  if(f==="pm") h=`<label class="l">${t("pm")}</label>${sel("pm",[["cash",LANG==="ar"?"نقدي":"Cash"],["bank",LANG==="ar"?"تحويل":"Bank"],["cheque",LANG==="ar"?"شيك":"Cheque"],["credit",LANG==="ar"?"آجل":"Credit"]],d.pm||"credit")}`;
  if(f==="term") h=`<label class="l">${t("term")}</label>${inp("term",d.term??0,"number")}`;
  if(f==="account") h=`<label class="l">${t("account")}</label>${sel("account",[["",LANG==="ar"?"— اختر —":"— select —"]].concat(S.accounts.filter(a=>a.cat==="X").map(a=>[String(a.code),a.code+" · "+nm({ar:a.ar,en:a.en})])),d.account)}`;
  if(f==="taxq") h=`<label style="display:flex;gap:10px;align-items:center;padding:12px 4px"><input type="checkbox" style="width:22px;height:22px" ${d.taxq?"checked":""} onchange="fset('taxq',this.checked?1:0)"> ${t("taxq")} (${Math.round(S.settings.taxRate*100)}%)</label>`;
  if(f==="notes") h=`<label class="l">${t("notes")}</label>${inp("notes",d.notes||"")}`;
  if(f==="branch") h="";
  out.push(fld(f,h+helpBtn(f),HELP[f]?HELP[f][LANG]:""));
 });
 return out.join("");
}

   Object.values(groups).sort((a,b)=>fmtDate(a[0][1].date).localeCompare(fmtDate(b[0][1].date))).forEach(rows=>{ const x=rows[0][1]; const type=String(x.type).toUpperCase();
     if(!OPS[type]) return errs.push("Operations "+rows[0][0]+": type");
     const o={id:0,date:fmtDate(x.date),doc:String(x.doc||"").trim(),type,party:String(x.party||"")||undefined,rep:String(x.rep||""),ref:String(x.ref||"")||undefined,taxq:+x.taxq?1:0,pm:String(x.pm||"")||undefined,term:+x.term||0,chq:String(x.chq||"")||undefined,due:fmtDate(x.due)||undefined,bank:String(x.bank||"")||undefined,account:String(x.account||"")||undefined,amount:+x.amount||0,notes:String(x.notes||""),fx:1,cur:S.settings.cur};
     if(OPS[type].lines) o.lines=rows.filter(r=>r[1].item).map(([,r])=>({item:String(r.item),qty:+r.qty||0,price:+r.price||0,sn:String(r.serials||"").split(",").map(s=>s.trim()).filter(Boolean)}));
     if(OPS[type].lines&&o.lines) o.lines.forEach(l=>{ const it=itemById(l.item); if(it&&+it.serial) l.qty=l.sn.length; });
     const e=saveOpObj(o); if(e.length) errs.push("Operations "+rows[0][0]+" ("+o.doc+"): "+e.map(z=>t(z)).join(", ")); else no++; });
   persist(); closeSheet();
   openSheet(LANG==="ar"?"نتيجة الاستيراد":"Import result",`<div class="cards"><div class="chip ok">${np} ${t("parties")}</div> <div class="chip ok">${ni} ${t("stock")}</div> <div class="chip ok">${no} ${t("docs")||"docs"}</div></div>${errs.length?`<div class="err" style="white-space:pre-wrap">${esc(errs.join("\n"))}</div>`:`<div style="color:var(--ok)">✓ ${t("imp_done")}</div>`}`,`<button class="btn" onclick="closeSheet()">${t("close")}</button>`);
   render();
 }catch(e){ toast("✗ "+e.message,"bad"); } }; r.readAsArrayBuffer(f); }
function backupJSON(){ const b=new Blob([JSON.stringify(S)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="erp-backup.json"; a.click(); }

 if(!f){ $("lerr").textContent=t("bad_login"); $("lerr").classList.remove("hidden"); return; }
 USER=f; $("login").classList.add("hidden"); $("app").classList.remove("hidden"); STACK=[]; VIEW="home";
 render(); checkAlerts(); alerts().forEach(a=>SEEN.add(a.k)); toast(t("welcome")+" "+f.name,"ok"); }

 S=load(); persist();
 document.documentElement.lang=LANG; document.documentElement.dir=LANG==="ar"?"rtl":"ltr"; document.body.setAttribute("dir",LANG==="ar"?"rtl":"ltr");
 applyLoginLang(); $("lg-demo").textContent=(LANG==="ar"?"تجريبي: ":"Demo: ")+"admin/admin123 · accountant/acc123 · sales/sales123 · cashier/cash123 · viewer/view123";
 $("lu").addEventListener("keydown",e=>{ if(e.key==="Enter") $("lp").focus(); }); $("lp").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
}
